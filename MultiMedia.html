<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Web Page</title>
</head>
<body>
    <h1>Welcome to the Multimedia Showcase</h1>
    <p>This page demonstrates how multimedia can be embedded into a web page.</p>
    
    <!-- Image -->
    <h2>Image</h2>
    <img src="https://via.placeholder.com/300x200" alt="Sample Image" width="300" height="200">

    <!-- Audio -->
    <h2>Audio</h2>
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Video -->
    <h2>Video</h2>
    <video controls width="400">
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <!-- Embed YouTube Video -->
    <h2>YouTube Video</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="YouTube Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; 
        encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <!-- Background Audio -->
    <h2>Background Music</h2>
    <audio autoplay loop>
        <source src="background-music
