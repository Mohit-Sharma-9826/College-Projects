<!DOCTYPE html>
<html>
<head>
    <title>Embedded Stylesheet</title>
    <link rel="stylesheet" href="EmbededStyleSheet.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            color: blue;
        }
        p {
            color: green;
        }
    </style>
</head>
<body>
    <h1>This is an Embedded Stylesheet</h1>
    <p>The styles are defined in the style tag within the head section.</p>
    <p style="color: red;">This is inline css</p>
    <p id="external">This is external css</p>
</body>
</html>
